# ---------------------------------------------------------------------------
# This is an example of an Nginx server config for a BlackFox site
# (PHP-FPM / php-cgi over FastCGI).
#
# Tasks:
# - copy this into your own server{} block (or include it)
# - replace word 'Site' with the unique name of your project's folder\namespace
#   (same rename you already did for config.php / .htaccess)
# - fill in the values marked <...>
# - delete this comment
#
# Two blocks below are NOT generic nginx boilerplate - they exist because of
# how BlackFox\Engine actually resolves requests, and are direct translations
# of the rules already in this folder's .htaccess:
#
# 1. Trailing-slash redirect for extension-less URLs.
#    BlackFox\Engine::MakeContent() (BlackFox/classes/Engine.php) does
#    roughly:
#       $path = $root . $this->url['path'];
#       if (is_dir($path)) { $path .= 'index.php'; }
#    with no separator check. Request a "directory" URL without a trailing
#    slash (e.g. /some/section instead of /some/section/) and the
#    concatenation silently produces a bogus path ("...sectionindex.php"),
#    which doesn't exist -> 404. .htaccess masks this with
#    RedirectMatch ^([^\.]*[^/])$ $1/  - this config reproduces that.
#
# 2. /Site/root fallback for static files.
#    Templates may reference assets with paths relative to the site root
#    even though the actual files live under Site/root/ (BlackFox's
#    "virtual root" overlay, see config.php's 'roots' key). .htaccess
#    transparently retries any missing static request under /Site/root/
#    before giving up; this config does the same with try_files.
#
# Everything else (any request that isn't a real static file) is routed
# through index.php - deliberately, even for paths that look like real
# .php files. BlackFox has no separate router for "content" .php files
# under root/ (pages, admin panels, etc.) - they're meant to be require()'d
# by Engine with $this bound, never executed standalone. Letting nginx
# execute them directly would run them outside Engine's context (auth,
# language, template) and for admin-panel scripts specifically would mean
# bypassing whatever access control Engine normally applies before
# including them.
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  <your-site.loc>;
    root         "<path-to-your-project-root>";
    index        index.php;

    access_log   logs/<your-site>.access.log;
    error_log    logs/<your-site>.error.log;

    add_header X-Content-Type-Options nosniff always;

    # 1) extension-less URL, no trailing slash -> redirect adding one
    location ~ ^(?<slashless>/[^.]*[^./])$ {
        return 302 $slashless/;
    }

    # 2) real static assets - try the literal path, then the Site/root
    #    overlay, else 404. Extend the extension list if your project
    #    serves other static types.
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|webp|woff2?|ttf|eot|mp4|webm|pdf|txt|html)$ {
        try_files $uri /Site/root$uri =404;
        expires 1d;
        access_log off;
    }

    # 3) everything else -> single front controller. SCRIPT_FILENAME is
    #    hardcoded to index.php on purpose (see note above) rather than
    #    derived from the request path.
    location / {
        fastcgi_pass    <php-fpm-or-php-cgi-address>;   # e.g. 127.0.0.1:9000 or unix:/run/php/php-fpm.sock
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME  $document_root/index.php;
        fastcgi_param   SCRIPT_NAME      /index.php;
    }
}
